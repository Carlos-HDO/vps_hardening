name: CI & Quality Assurance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: ShellCheck & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax (bash -n)
        run: |
          bash -n hardening.sh
          bash -n rollback.sh
          bash -n quick-install.sh
          bash -n configs/ssh-login-alert.sh

      - name: Run ShellCheck
        run: |
          shellcheck -x -e SC1091 -e SC2086 -e SC2034 \
            hardening.sh \
            rollback.sh \
            quick-install.sh \
            configs/ssh-login-alert.sh

  dry-run-matrix:
    name: Dry-Run Simulation Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - "ubuntu:20.04"
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "debian:11"
          - "debian:12"
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install minimal prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq sudo curl bash

      - name: Test Help & CLI Flags
        run: |
          ./hardening.sh --help
          ./rollback.sh --help

      - name: Execute Full Dry-Run Simulation
        run: |
          ./hardening.sh --dry-run \
            -u testoperator \
            -k "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGenericCiKeyForAutomatedVerification123" \
            -p 52211 \
            -a 80,443,51820/udp \
            --tg-token "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11" \
            --tg-chat "987654321" \
            -y
